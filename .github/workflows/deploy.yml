name: Deploy to Netlify

on:
  push:
    branches: [ main ]

concurrency: # new commits on the same branch/PR cancel the older, now-obsolete run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2" # single source of truth, reused by all jobs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onepage
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Flutter SDK # local composite action: avoids marketplace actions with unpinned nested steps
        # Install the pinned Flutter SDK used by the repo.
        uses: design-leaders-finland/.github/actions/setup-flutter@b9dc79c591b43b0a6eac4d5dcb0c5e89be9af16b
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Cache pub dependencies
        # Reuse pub cache to speed up dependency installs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - run: flutter pub get --enforce-lockfile

      - run: flutter build web --release

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@2304451b4038577aa079e27936cc520845d25345 # v4
        with:
          publish-dir: 'onepage/build/web' # Does not follow default working-directory
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1
