<!doctype html>
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Design System of the Design Leaders Finland Oy for their Flutter projects"
    />
    <meta name="theme-color" content="#FAFBFC" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Design Leaders System" />
    <link rel="apple-touch-icon" href="icons/icon-92.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Design System of Design Leaders Finland</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      /* ==========================================================================
         Modular WASM loader shell
         --------------------------------------------------------------------------
         Deployment is web-only, so this page is a hand-written shell. The Flutter
         app ships as a separate WASM module (built with `flutter build web --wasm`).
         To make the ink-drop feedback *instantly* visible we render it here in
         plain HTML/CSS/SVG - before any Dart / WASM bytecode is even downloaded -
         and only hand off to the running Flutter app once its engine is ready.
         ========================================================================== */

      :root {
        --dls-bg: #fafbfc; /* AppColors.background */
        --dls-accent: #2f927b; /* AppColors.accent */
        --dls-track: rgba(27, 42, 74, 0.14); /* subtle ~10% of primary #1B2A4A */
        --dls-ink-size: 4rem;
        --dls-stroke: 0.5625rem;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--dls-bg);
      }

      /* Full-screen splash. Absolutely positioned so it overlays the Flutter
         view (which is appended to <body> by the engine) until it is removed. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: var(--dls-bg);
      }

      .dls-ink {
        width: var(--dls-ink-size);
        height: var(--dls-ink-size);
        display: block;
        overflow: visible;
      }

      /* Seamless donut track, no cap so there is no visible joint. */
      .dls-ink-track {
        fill: none;
        stroke: var(--dls-track);
        stroke-width: var(--dls-stroke);
      }

      .dls-ink-ring {
        fill: none;
        stroke: var(--dls-accent);
        stroke-width: var(--dls-stroke);
        transform-origin: 50% 50%;
        animation: dls-ring 1.4s ease-in-out infinite;
      }

      /* The donut fills clockwise from empty to full, then empties again also clockwise:
         the second half keeps rotating the same direction so the trailing edge stays put
         while the leading edge chases it around instead of unwinding backwards. */
      @keyframes dls-ring {
        0% {
          stroke-dasharray: 0 100;
          transform: rotate(-90deg);
        }
        50% {
          stroke-dasharray: 100 0;
          transform: rotate(-90deg);
        }
        100% {
          stroke-dasharray: 0 100;
          transform: rotate(270deg);
        }
      }

      /* Respect users who prefer reduced motion: keep it moving, just slower. */
      @media (prefers-reduced-motion: reduce) {
        .dls-ink-ring {
          animation-duration: 3.6s;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 24px; color: #1a1a2e">
        Please enable JavaScript to view the Design System.
      </div>
    </noscript>

    <!-- Instantly-visible loading animation. Purely HTML/CSS/SVG so it
         paints before any Dart/WASM code is fetched, and stays on screen until
         the Flutter WASM engine is ready (see inline bootstrap below). -->
    <div id="loading" role="status" aria-live="polite" aria-label="Loading the Design System">
      <svg class="dls-ink" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <!-- Persistent donut track. -->
        <circle class="dls-ink-track" cx="60" cy="60" r="42" pathLength="100" />
        <!-- Donut that fills and empties. -->
        <circle class="dls-ink-ring" cx="60" cy="60" r="42" pathLength="100" />
      </svg>
    </div>

    <!--
      Custom Flutter Web bootstrap ("modularized" loader):
      * {{flutter_js}}              -> inlines the tiny `flutter.js` loader (no Dart yet).
      * {{flutter_build_config}}    -> inlines the build descriptor so the loader knows
                                       which module(s) to fetch (dart2wasm primary,
                                       dart2js/canvaskit fallback).
      * `_flutter.loader.load({ onEntrypointLoaded })` downloads/compiles the WASM
        module and removes this splash the moment the app is about to run.
      Keeping the splash shell separate from the WASM module is what makes the ink
      drop appear instantly rather than after a multi-megabyte download.
    -->
    <script>
      {{flutter_js}}
      {{flutter_build_config}}
      window.addEventListener('load', function () {
        var splash = document.getElementById('loading');
        var loader = window._flutter && window._flutter.loader;

        // Fallback for cases where the build config was not inlined (e.g. a
        // plain static serve of index.html): load the default bootstrap.
        if (!loader || !window._flutter.buildConfig) {
          var bootstrap = document.createElement("script");
          bootstrap.src = "flutter_bootstrap.js";
          bootstrap.async = true;
          document.head.appendChild(bootstrap);
          return;
        }

        window._flutter.loader.load({
          onEntrypointLoaded: async function (engineInitializer) {
            // Configure the engine (skwasm / canvaskit chosen by the loader),
            // then remove the HTML splash right before the app runs.
            var appRunner = await engineInitializer.initializeEngine();
            if (splash) splash.remove();
            await appRunner.runApp();
          },
        });
      });
    </script>
  </body>
</html>
