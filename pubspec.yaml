name: design_leaders_system
description: The Design System of Design Leaders Finland in-house provided apps
version: 0.1.0
license: Apache-2
homepage: https://design-leaders-design-system.netlify.app/
repository: https://github.com/Design-Leaders-Finland/design-system

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.2"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/fonts/Figtree-Light.ttf
    - assets/fonts/Figtree-Regular.ttf
    - assets/fonts/Figtree-SemiBold.ttf
    - assets/fonts/AsapCondensed-Light.ttf
    - assets/fonts/AsapCondensed-Regular.ttf
    - assets/fonts/AsapCondensed-SemiBold.ttf
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Light.ttf
          weight: 300
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
    - family: Asap Condensed
      fonts:
        - asset: assets/fonts/AsapCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/AsapCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/AsapCondensed-SemiBold.ttf
          weight: 600
  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
